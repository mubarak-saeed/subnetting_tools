name: subnetting_tools
description: "Professional Network Tools & Subnetting Workbench"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  google_fonts: ^8.2.0
  hive: ^2.2.3
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Ciro/Cairo-Regular.ttf
        - asset: fonts/Ciro/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Ciro/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Ciro/Cairo-Medium.ttf
          weight: 500
        - asset: fonts/Ciro/Cairo-Light.ttf
          weight: 300
        - asset: fonts/Ciro/Cairo-Black.ttf
          weight: 900
